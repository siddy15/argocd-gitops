name: Build and Update Manifest

on:
  push:
    branches: [worker]
    paths:
      - 'app.py'
      - 'Dockerfile'
      # don't retrigger on manifest commits from this workflow itself
      - '!k8s/**'
      - '!.github/**'

env:
  IMAGE_NAME: siddy15/gitops-argocd-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # needed to git push the manifest update back
    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: vars
        run: echo "tag=${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Update manifest with new image tag
        run: |
          sed -i "s|image: ${IMAGE_NAME}:.*|image: ${IMAGE_NAME}:${{ steps.vars.outputs.tag }}|" deployment.yml

      - name: Commit and push manifest change
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deployment.yml
          git diff --cached --quiet || git commit -m "ci: bump image to ${{ steps.vars.outputs.tag }}"
          git push
